[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-research-ai"
version = "2.0.0"
description = "Wieloźródłowy agent researchowy: Wikipedia + Web + Gemini."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
